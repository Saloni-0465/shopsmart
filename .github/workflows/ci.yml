name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: ESLint & Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: ESLint (client)
        working-directory: client
        run: npm run lint

      - name: ESLint (server)
        working-directory: server
        run: npm run lint

      - name: Prettier check (client)
        working-directory: client
        run: npm run format:check

      - name: Prettier check (server)
        working-directory: server
        run: npm run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Unit tests (client)
        working-directory: client
        run: npm test

      - name: Unit tests (server)
        working-directory: server
        run: npm test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopsmart_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      CI: true
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/shopsmart_e2e
      JWT_SECRET: ci-e2e-jwt-secret-change-in-real-deployments
      SHOPSMART_INTEGRATION: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Prisma migrate (e2e DB)
        working-directory: server
        run: npx prisma migrate deploy

      - name: Seed catalog (products for cart test)
        working-directory: server
        run: npm run db:seed

      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start API
        run: |
          cd server
          node src/index.js &
          echo $! > /tmp/shopsmart-api.pid
          cd "${{ github.workspace }}"
          npx wait-on http-get://127.0.0.1:5001/api/health -t 120000

      - name: Start Vite
        run: |
          cd client
          npx vite --host 127.0.0.1 --port 5173 &
          echo $! > /tmp/shopsmart-vite.pid
          cd "${{ github.workspace }}"
          npx wait-on http-get://127.0.0.1:5173 -t 120000

      - name: Run Playwright
        run: npx playwright test

      - name: Stop background servers
        if: always()
        run: |
          for f in /tmp/shopsmart-vite.pid /tmp/shopsmart-api.pid; do
            if [ -f "$f" ]; then kill $(cat "$f") 2>/dev/null || true; fi
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
